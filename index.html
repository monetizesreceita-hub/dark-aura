<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>@vitor.release</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg-main:#05000f;
  --text:#fff;
  --card:rgba(255,255,255,0.05);
}
body.light{--bg-main:#fff;--text:#000;--card:rgba(0,0,0,0.05);}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}

body{
  background:var(--bg-main);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden; /* 🔥 permite scroll vertical */
}

/* SAFE AREA */
.container{
  max-width:420px;
  width:100%;
  padding:20px;
  margin:auto;
  padding-top:80px;
  padding-bottom:40px;
}

.bg-video{
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-3;
}

.btn{
  width:100%;
  padding:15px;
  margin:10px 0;
  border-radius:40px;
  border:none;
  color:#fff;
  background:linear-gradient(90deg,#b300ff,#00eaff);
  font-size:16px;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:15px;
  margin-top:15px;
  backdrop-filter: blur(10px);
}

.chat-box{
  height:150px;
  overflow:auto;
  text-align:left;
  font-size:12px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin:6px 0;
  font-size:14px;
}

/* MENU */
#menuDrop{
display:none;
position:absolute;
right:0;
top:30px;
background:black;
padding:10px;
border-radius:10px;
}

/* RESPONSIVO EXTRA */
@media (max-width:400px){
  .btn{font-size:14px;padding:12px;}
}
</style>
</head>

<body>

<!-- MENU -->
<div style="position:fixed;top:15px;right:15px;z-index:999;">
  <button onclick="toggleMenu()" style="background:none;border:none;color:white;font-size:22px;">
    ☰
  </button>

  <div id="menuDrop">
    <p onclick="logout()">🚪 Logout</p>
    <p>⚙️ Config</p>
    <p>🛠️ Suporte</p>
  </div>
</div>

<div id="particles-js"></div>

<video class="bg-video" autoplay muted loop playsinline>
<source src="assets/video/bg.mp4" type="video/mp4">
</video>

<div class="container">

<h2>@vitor.release</h2>

<button class="btn" onclick="toggleTheme()">🌙 Tema</button>

<a href="sobre.html" class="btn">👤 Sobre mim</a>

<!-- LOGIN -->
<div class="card" id="loginCard">
<h3>🔐 Login Firebase</h3>
<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<button class="btn" onclick="register()">Registrar</button>
<button class="btn" onclick="login()">Entrar</button>
</div>

<!-- RANKING -->
<div class="card">
<h3>🏆 Ranking Global</h3>
<button class="btn" onclick="addScore()">Adicionar Pontos</button>
<div id="ranking"></div>
</div>

<!-- CHAT -->
<div class="card">
<h3>💬 Chat Global</h3>
<div class="chat-box" id="chat"></div>
<input id="msg" placeholder="Mensagem">
<button class="btn" onclick="sendMsg()">Enviar</button>
</div>

<!-- JOGOS -->
<div class="card">
<h3>🎮 Jogos</h3>
<iframe src="https://www.crazygames.com/embed/space-waves" width="100%" height="220" style="border-radius:10px;"></iframe>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh_2uT0YvHfX3ZY1Ejp9FebyTgvqbGI28",
  authDomain: "login-3d85e.firebaseapp.com",
  projectId: "login-3d85e",
  storageBucket: "login-3d85e.firebasestorage.app",
  messagingSenderId: "1064156003724",
  appId: "1:1064156003724:web:eb47844ce9d81762256aa9",
  measurementId: "G-EFLBW3PPZY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

// LOGIN
window.register = () => {
  createUserWithEmailAndPassword(auth, email.value, senha.value)
    .then(()=> alert("Conta criada 🔥"))
    .catch(e=>alert(e.message));
};

window.login = () => {
  signInWithEmailAndPassword(auth, email.value, senha.value)
    .catch(e=>alert(e.message));
};

// LOGOUT
window.logout = () => {
  signOut(auth);
};

// DETECTA LOGIN
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user.email;

    document.getElementById("loginCard").innerHTML =
      "<h3>🔥 Logado como:</h3><p>"+user.email+"</p>";
  } else {
    location.reload();
  }
});

// CHAT
window.sendMsg = async () => {
  if(!currentUser) return alert("Faça login!");
  await addDoc(collection(db,"chat"), {
    msg: msg.value,
    user: currentUser
  });
};

// ATUALIZA CHAT
onSnapshot(collection(db,"chat"), snap=>{
  chat.innerHTML="";
  snap.forEach(doc=>{
    let d = doc.data();
    chat.innerHTML += "<p><b>"+d.user+":</b> "+d.msg+"</p>";
  });
});

// RANKING
window.addScore = async () => {
  if(!currentUser) return alert("Faça login!");
  await addDoc(collection(db,"rank"), {
    user: currentUser,
    score: Math.floor(Math.random()*100)
  });
};

onSnapshot(collection(db,"rank"), snap=>{
  ranking.innerHTML="";
  snap.forEach(doc=>{
    let d = doc.data();
    ranking.innerHTML += "<p>"+d.user+" - "+d.score+"</p>";
  });
});
</script>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
function toggleTheme(){
document.body.classList.toggle("light");
}

function toggleMenu(){
let m = document.getElementById("menuDrop");
m.style.display = m.style.display === "block" ? "none" : "block";
}

particlesJS("particles-js",{particles:{number:{value:40}}});
</script>

</body>
</html>
