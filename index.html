<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>@vitor.release</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root{
      --bg-main: #05000f;
      --text-main: #ffffff;
      --card-bg: rgba(255,255,255,0.05);
    }

    body.light {
      --bg-main: #f5f5f5;
      --text-main: #111;
      --card-bg: rgba(0,0,0,0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow: hidden;
      background: var(--bg-main);
    }

    /* LOADER */
    #loader {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-size: 22px;
      letter-spacing: 2px;
    }

    /* ===== VÍDEO DE FUNDO ===== */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Partículas */
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -3;
    }

    /* Overlay escuro */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(120,0,255,0.15), rgba(5,0,15,0.9));
      z-index: -1;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .nav-btn {
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    /* MENU LATERAL */
    #menu {
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      height: 100%;
      background: #000;
      padding: 20px;
      transition: 0.3s;
      z-index: 20;
    }

    #menu p {
      margin: 15px 0;
      cursor: pointer;
    }

    /* ===== CONTAINER ===== */
    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      text-align: center;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

    .username {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(90deg, #ff4dff, #6cf3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    /* BOTÕES */
    .btn {
      width: 100%;
      padding: 16px;
      margin: 14px 0;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 500;
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(90deg, #b300ff, #00eaff);
      box-shadow: 0 0 25px rgba(170, 0, 255, 0.6);
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 40px rgba(0, 234, 255, 0.9);
    }

    /* CARDS */
    .card {
      margin-top: 20px;
      padding: 20px;
      border-radius: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
    }

    input {
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:10px;
      border:none;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.6;
    }

    .version {
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <!-- LOADER -->
  <div id="loader">LOADING...</div>

  <!-- PARTÍCULAS -->
  <div id="particles-js"></div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-btn" onclick="toggleTheme()">
      <i class="fa-solid fa-moon"></i>
    </div>
    <div class="nav-btn">
      <i class="fa-solid fa-bars"></i>
    </div>
  </div>

  <!-- MENU -->
  <div id="menu">
    <h3>Menu</h3>
    <p>🎮 Jogos</p>
    <p>👤 Perfil</p>
    <p>⚙️ Config</p>
  </div>

  <!-- VÍDEO ORIGINAL MANTIDO -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="assets/video/bg.mp4" type="video/mp4">
  </video>

  <div class="container">
    <div class="username">
      <i class="fa-brands fa-instagram"></i> @vitor.release
    </div>

    <div class="subtitle">
      Dark Aura • Neon • Cyber • Gaming
    </div>

    <!-- BOTÕES ORIGINAIS -->
    <a href="games.html" class="btn">
      <i class="fa-solid fa-gamepad"></i> Área de Jogos
    </a>

    <a href="sobre.html" class="btn">
      <i class="fa-solid fa-user"></i> Sobre mim
    </a>

    <a href="https://instagram.com/vitor.release" target="_blank" class="btn">
      <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <!-- LOGIN -->
    <div class="card" id="loginBox">
      <h3>🔐 Login</h3>
      <input type="text" id="user" placeholder="Usuário">
      <input type="password" placeholder="Senha">
      <button class="btn" onclick="login()">Entrar</button>
    </div>

    <!-- HUB -->
    <div class="card">
      <h3>🔥 Gaming Hub</h3>
      <p>Plataforma em evolução estilo servidor.</p>
    </div>

    <footer>
      © Dark Aura • All Neon Rights Reserved
    </footer>

    <div class="version">
      Version 3.3.2.33.2026 • Gaming Build
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <script>
    // Loader
    window.onload = () => {
      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
      }, 1200);
    };

    // Tema
    function toggleTheme(){
      document.body.classList.toggle("light");
    }

    // Menu
    document.querySelector(".fa-bars").onclick = () => {
      let menu = document.getElementById("menu");
      menu.style.left = menu.style.left === "0px" ? "-250px" : "0px";
    };

    // Login fake
    function login(){
      let user = document.getElementById("user").value;
      if(user.length > 2){
        document.getElementById("loginBox").innerHTML =
          "<h3>🔥 Bem-vindo, "+user+"!</h3>";
      }
    }

    // Partículas
    particlesJS("particles-js", {
      particles: {
        number: { value: 40 },
        color: { value: "#00eaff" },
        size: { value: 2 },
        move: { speed: 1 }
      }
    });
  </script>

</body>
</html>
